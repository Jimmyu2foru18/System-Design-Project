services:
  - type: web
    name: recspicy-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NUTRITION_APP_ID
        sync: false
      - key: NUTRITION_APP_KEY
        sync: false
      - key: CLIENT_ORIGIN
        value: https://recspicy.ct.ws
