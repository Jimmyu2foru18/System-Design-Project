services:
  - type: web
    name: recspicy
    env: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: https://recspicy.onrender.com
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: NUTRITION_APP_ID
        sync: false
      - key: NUTRITION_APP_KEY
        sync: false
